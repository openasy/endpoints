{
  "decorators": {
    "load": ["SELECT '1' AS endpoints_pack"]
  },
  "schedule": {
    "endpoints_inventory": {
      "query": "SELECT s.hostname, s.computer_name, s.uuid, s.hardware_vendor, s.hardware_model, s.hardware_serial, s.cpu_brand, s.physical_memory, o.name AS os_name, o.version AS os_version, o.major AS os_major, o.minor AS os_minor, o.patch AS os_patch, o.build AS os_build, o.platform AS os_platform, q.version AS osquery_version FROM system_info s, os_version o, osquery_info q;",
      "interval": 3600,
      "snapshot": true,
      "description": "Hardware, operating system and osquery version."
    },
    "endpoints_users": {
      "query": "SELECT uid, username, description FROM users WHERE uid >= 500 AND uid < 65534 AND shell NOT LIKE '%/false' AND shell NOT LIKE '%/nologin';",
      "interval": 3600,
      "platform": "posix",
      "snapshot": true,
      "description": "Local accounts people sign in with."
    },
    "endpoints_users_windows": {
      "query": "SELECT uid, username, description FROM users WHERE type = 'local' AND uid >= 1000;",
      "interval": 3600,
      "platform": "windows",
      "snapshot": true,
      "description": "Local accounts people sign in with."
    },
    "endpoints_encryption_macos": {
      "query": "SELECT m.path, de.encrypted, de.type, de.filevault_status FROM mounts m JOIN disk_encryption de ON m.device_alias = de.name WHERE m.path IN ('/', '/System/Volumes/Data');",
      "interval": 900,
      "platform": "darwin",
      "snapshot": true,
      "description": "FileVault on the system and data volumes."
    },
    "endpoints_encryption_linux": {
      "query": "SELECT m.path, de.encrypted, de.type FROM mounts m JOIN disk_encryption de ON m.device_alias = de.name WHERE m.path = '/';",
      "interval": 900,
      "platform": "linux",
      "snapshot": true,
      "description": "LUKS on the disk that holds /."
    },
    "endpoints_encryption_windows": {
      "query": "SELECT drive_letter, protection_status, conversion_status, encryption_method FROM bitlocker_info WHERE drive_letter = 'C:';",
      "interval": 900,
      "platform": "windows",
      "snapshot": true,
      "description": "BitLocker on the system drive."
    },
    "endpoints_firewall_macos": {
      "query": "SELECT global_state FROM alf;",
      "interval": 900,
      "platform": "darwin",
      "snapshot": true,
      "description": "The application firewall."
    },
    "endpoints_firewall_windows": {
      "query": "SELECT firewall FROM windows_security_center;",
      "interval": 900,
      "platform": "windows",
      "snapshot": true,
      "description": "Windows Defender Firewall, as Security Center reports it."
    },
    "endpoints_screenlock_macos": {
      "query": "SELECT enabled, grace_period FROM screenlock;",
      "interval": 900,
      "platform": "darwin",
      "snapshot": true,
      "description": "A password after sleep or the screen saver, and how soon."
    },
    "endpoints_screenlock_windows": {
      "query": "SELECT data FROM registry WHERE key = 'HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' AND name = 'InactivityTimeoutSecs';",
      "interval": 900,
      "platform": "windows",
      "snapshot": true,
      "description": "The machine inactivity limit, after which Windows locks."
    },
    "endpoints_software_macos": {
      "query": "SELECT name, bundle_short_version AS version, bundle_identifier AS identifier, path FROM apps WHERE path NOT LIKE '%.app/%';",
      "interval": 3600,
      "platform": "darwin",
      "snapshot": true,
      "description": "Applications, without the helpers inside other applications."
    },
    "endpoints_software_windows": {
      "query": "SELECT name, version, publisher, identifying_number AS identifier FROM programs;",
      "interval": 3600,
      "platform": "windows",
      "snapshot": true,
      "description": "Programs in Apps and Features."
    },
    "endpoints_software_deb": {
      "query": "SELECT name, version, maintainer AS publisher FROM deb_packages WHERE status = 'install ok installed';",
      "interval": 3600,
      "platform": "linux",
      "snapshot": true,
      "description": "Debian and Ubuntu packages."
    },
    "endpoints_software_rpm": {
      "query": "SELECT name, version || '-' || release AS version, vendor AS publisher FROM rpm_packages;",
      "interval": 3600,
      "platform": "linux",
      "snapshot": true,
      "description": "Fedora, RHEL and SUSE packages."
    }
  }
}
